name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only ever reads the repo: it checks out, installs, and runs the suites.
# Declared at the workflow level so every job inherits the floor and a new job
# can't silently pick up the default write-scoped token.
permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24.x is the floor declared in package.json engines and what the
        # release builds use. Node 18 and 20 are both past end-of-life
        # (2025-04-30 and 2026-04-30); 26.x becomes LTS in Oct 2026 and should
        # join this matrix then.
        node: ['24.x']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # `npm ci`: strict, lockfile-exact installs. The lockfile is generated
      # with node_modules moved aside (see CLAUDE.md) so it carries every
      # platform's optional binaries, not just the maintainer's darwin-arm64.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck, lint, format, coverage
        run: npm run verify

  e2e:
    name: e2e (playwright + electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Electron's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libnss3 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libgtk-3-0

      - name: Run E2E suite
        run: xvfb-run -a npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
