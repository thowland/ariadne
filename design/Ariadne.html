  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

     <div style=\"min-width:0\">\n          <div style=\"font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ viewTitle }}<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#9a9a92;font-family:ui-monospace,Menlo,monospace;margin-top:1px\">{{ topbarDate }}<\u002Fdiv>\n        <\u002Fdiv>\n        {{ overduePill }}\n        <div style=\"flex:1\"><\u002Fdiv>\n        <input class=\"inp\" value=\"{{ q }}\" oninput=\"{{ onSearch }}\" placeholder=\"Search tasks &amp; projects…\" style=\"width:230px;padding:8px 12px;border:1px solid rgba(20,20,15,.12);border-radius:9px;font-size:13px;background:#fff\">\n        <button class=\"btn primary\" onclick=\"{{ onNewTask }}\" style=\"font-size:13px;font-weight:600;padding:8px 14px;border-radius:9px;background:#4f5bd5;color:#fff;white-space:nowrap\">+ New task<\u002Fbutton>\n      <\u002Fheader>\n      <div class=\"scr\" style=\"flex:1;overflow:auto;padding:24px 22px 60px\">{{ viewBody }}<\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n{{ modalEl }}\n{{ toastEl }}\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#4f5bd5&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Comfortable&quot;,&quot;options&quot;:[&quot;Comfortable&quot;,&quot;Compact&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;startView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Command Center&quot;,&quot;options&quot;:[&quot;Command Center&quot;,&quot;Calendar&quot;,&quot;Reports&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\nclass Component extends DCLogic {\n  TODAY = '2026-07-08';\n  STATUSES = ['Todo','Doing','Waiting','Done','Dropped'];\n  PRIORITIES = ['Critical','High','Medium','Low'];\n  PALETTE = ['#4f5bd5','#2f8552','#a8710f','#c23b2b','#7c4dd6','#0e8a8a','#c2569b'];\n  STATUS = {\n    Todo:{c:'#7d7d75',bg:'#efefec',dot:'#b4b4ac'},\n    Doing:{c:'#2f62d8',bg:'#e9f0fd',dot:'#2f62d8'},\n    Waiting:{c:'#a8710f',bg:'#faf0dc',dot:'#d69220'},\n    Done:{c:'#2f8552',bg:'#e7f3ec',dot:'#3a9a5f'},\n    Dropped:{c:'#9a9a92',bg:'#f0f0ee',dot:'#bdbdb5'}\n  };\n  PRIO = {\n    Critical:{c:'#c23b2b',dot:'#d94c3a',bg:'#fbeae7'},\n    High:{c:'#a8710f',dot:'#e0a020',bg:'#faf0dc'},\n    Medium:{c:'#4f5bd5',dot:'#6b76e0',bg:'#eef0fc'},\n    Low:{c:'#8a8a82',dot:'#c2c2ba',bg:'#f1f1ef'}\n  };\n  C = {bg:'#f6f6f4',surface:'#ffffff',surface2:'#fbfbfa',border:'rgba(20,20,15,.10)',border2:'rgba(20,20,15,.06)',text:'#1b1b18',muted:'#73736c',faint:'#9a9a92',accent:'#4f5bd5'};\n\n  state = {\n    authed:false, loginUser:'', loginPass:'', loginError:'',\n    view:'home', activeProjectId:null, modal:null, data:null,\n    q:'', scope:'all', calMonth:'2026-07',\n    reportType:'weekly', reportTag:'all', reportFrom:'2026-06-08', reportTo:'2026-07-08',\n    quickTitle:'', importText:'', pwUser:'', pwPass:'', toast:null, fileMode:'preview'\n  };\n\n  componentDidMount(){\n    this.load();\n    this._esc = (e)=>{ if(e.key==='Escape' && this.state.modal) this.setState({modal:null}); };\n    window.addEventListener('keydown', this._esc);\n  }\n  componentWillUnmount(){ window.removeEventListener('keydown', this._esc); if(this._toastT) clearTimeout(this._toastT); }\n\n  load(){\n    let data=null;\n    try{ data=JSON.parse(localStorage.getItem('throughline.data.v1')); }catch(e){}\n    if(!data || !data.projects || !data.projects.length){ data=this.seed(); this.persist(data); }\n    if(!data.settings) data.settings={todoistToken:''};\n    if(!data.files){ data.files=[]; (data.projects||[]).forEach(p=>{ (p.docs||[]).forEach(dc=>{ data.files.push({id:'f'+Math.random().toString(36).slice(2,10),projectId:p.id,taskId:null,name:dc.name||'Document',ext:'',mime:'',kind:'ref',size:0,note:dc.note||'',content:'',createdAt:this.TODAY}); }); }); this.persist(data); }\n    try{ this.blobs=JSON.parse(localStorage.getItem('throughline.blobs.v1'))||{}; }catch(e){ this.blobs={}; }\n    let creds=null;\n    try{ creds=JSON.parse(localStorage.getItem('throughline.creds.v1')); }catch(e){}\n    if(!creds){ creds={user:'admin',pass:'admin'}; localStorage.setItem('throughline.creds.v1',JSON.stringify(creds)); }\n    this.creds=creds;\n    const start={'Command Center':'home','Calendar':'calendar','Reports':'reports'}[this.props.startView]||'home';\n    this.setState({data, view:start, pwUser:creds.user});\n  }\n  persist(data){ localStorage.setItem('throughline.data.v1', JSON.stringify(data)); }\n  save(fn){ const data=JSON.parse(JSON.stringify(this.state.data)); fn(data); this.persist(data); this.setState({data}); }\n  toast(msg){ this.setState({toast:msg}); if(this._toastT) clearTimeout(this._toastT); this._toastT=setTimeout(()=>this.setState({toast:null}),2600); }\n\n  // ---------- date helpers ----------\n  isoAdd(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }\n  dDiff(a,b){ return Math.round((new Date(a+'T00:00:00') - new Date(b+'T00:00:00'))/86400000); }\n  fmtShort(iso){ if(!iso) return ''; return new Date(iso+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); }\n  fmtLong(iso){ return new Date(iso+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}); }\n  relLabel(iso){ if(!iso) return {t:'',c:this.C.faint}; const n=this.dDiff(iso,this.TODAY); if(n<0) return {t:(-n)+'d overdue',c:'#d94c3a'}; if(n===0) return {t:'Today',c:'#c23b2b'}; if(n===1) return {t:'Tomorrow',c:'#a8710f'}; if(n<=7) return {t:'in '+n+'d',c:'#a8710f'}; return {t:this.fmtShort(iso),c:this.C.muted}; }\n  trunc(s,n){ s=s||''; return s.length>n ? s.slice(0,n-1)+'…' : s; }\n\n  // ---------- data accessors ----------\n  proj(id){ return (this.state.data.projects||[]).find(p=>p.id===id); }\n  byId(id){ return (this.state.data.tasks||[]).find(t=>t.id===id); }\n  tasksFor(pid){ return (this.state.data.tasks||[]).filter(t=>t.projectId===pid); }\n  allOpen(){ return (this.state.data.tasks||[]).filter(t=>t.status!=='Done'&&t.status!=='Dropped'); }\n  projectsInScope(){ const s=this.state.scope; return (this.state.data.projects||[]).filter(p=>s==='all'||p.category===s); }\n  tasksInScope(){ const s=this.state.scope; return (this.state.data.tasks||[]).filter(t=>{ if(s==='all') return true; const p=this.proj(t.projectId); return p&&p.category===s; }); }\n  isBlocked(t){ if(t.status==='Done'||t.status==='Dropped') return false; return (t.dependsOn||[]).some(id=>{ const d=this.byId(id); return d && d.status!=='Done' && d.status!=='Dropped'; }); }\n  byDue(a,b){ return (a.dueDate||'9999-99')<(b.dueDate||'9999-99')?-1:1; }\n  allTags(){ const s=new Set(); (this.state.data.projects||[]).forEach(p=>(p.tags||[]).forEach(t=>s.add(t))); return [...s].sort(); }\n\n  // ---------- mutations ----------\n  createTask(pid,patch){ const id='t'+Date.now().toString(36)+Math.floor(Math.random()*1e4); this.save(d=>{ d.tasks.push(Object.assign({id,projectId:pid,title:'',status:'Todo',priority:'Medium',tags:[],notes:'',dueDate:null,dependsOn:[],subtasks:[],links:[],createdAt:this.TODAY,completedAt:null},patch)); }); return id; }\n  updateTask(id,patch){ this.save(d=>{ const t=d.tasks.find(x=>x.id===id); if(!t) return; Object.assign(t,patch); if(patch.status==='Done'&&!t.completedAt) t.completedAt=this.TODAY; if(patch.status&&patch.status!=='Done') t.completedAt=null; }); }\n  deleteTask(id){ this.save(d=>{ d.tasks=d.tasks.filter(x=>x.id!==id); d.tasks.forEach(t=>{ t.dependsOn=(t.dependsOn||[]).filter(x=>x!==id); }); }); this.setState({modal:null}); }\n  cycleStatus(id){ const order=['Todo','Doing','Waiting','Done']; const t=this.byId(id); let i=order.indexOf(t
